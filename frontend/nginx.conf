server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: the dashboard routes on the client, so any unknown path must return the shell
  # rather than a 404, or a reload on any view but the root breaks.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed asset filenames change whenever content changes, so they can be cached indefinitely.
  # index.html must not be, or a deploy would keep serving the previous build's asset references.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
